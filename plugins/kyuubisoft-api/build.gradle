plugins {
    id 'java'
}

group = 'com.kyuubisoft'
version = '2.1.1'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Source files use UTF-8 (box-drawing chars in the startup banner, em-dashes in
// comments). Pin the encoding so builds are reproducible across platforms.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// No external repositories needed - Prometheus format is implemented manually

dependencies {
    // Hytale Server API (includes Netty, Gson, fastutil, JOML, etc.)
    // Copy the running server's HytaleServer.jar here before building, or
    // point at it with -PhytaleServerJar=/path/to/HytaleServer.jar.
    compileOnly files(findProperty('hytaleServerJar') ?: 'lib/HytaleServer.jar')
}

jar {
    archiveBaseName.set('KyuubiSoftAPI')
    archiveVersion.set(version)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(
            'Implementation-Title': 'KyuubiSoft API',
            'Implementation-Version': version
        )
    }
}

// Compile-only jar for mods that integrate with the panel (PanelRegistry & co.):
// just the public API package, no runtime. Mods add it as compileOnly and
// declare KyuubiSoftAPI as an optional dependency; at runtime the classes come
// from the installed plugin. See README, "Integrating your mod".
tasks.register('panelApiJar', Jar) {
    archiveBaseName.set('KyuubiSoftAPI-panel-api')
    archiveVersion.set(version)
    from(sourceSets.main.output) {
        include 'com/kyuubisoft/api/panel/*.class'
    }
    manifest {
        attributes(
            'Implementation-Title': 'KyuubiSoft API - panel integration (compile only)',
            'Implementation-Version': version
        )
    }
}

tasks.named('assemble') {
    dependsOn 'panelApiJar'
}
